<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#7EC8E3" />
    <meta name="description" content="Đôi mắt tinh nghịch – Bé tìm tranh an toàn." />
    <title>Đôi mắt tinh nghịch – Bé tìm tranh an toàn</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@500;700;800&family=Fredoka:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css?v=1" />
  </head>
  <body>
    <div class="world" aria-hidden="true">
      <div class="sun"></div>
      <div class="cloud c1"></div>
      <div class="cloud c2"></div>
      <div class="hill back"></div>
      <div class="hill"></div>
    </div>
    <div id="confetti" class="confetti" aria-hidden="true"></div>

    <section id="screen-start" class="screen screen-start is-active" aria-label="Mở đầu">
      <div class="start-stage">
        <a class="back-hub" href="../">← Mục lục</a>
        <p class="brand">Kỹ năng tự bảo vệ</p>
        <h1 class="title">
          <span class="title-line">Đôi mắt tinh nghịch</span>
          <span class="title-sub">Bé tìm tranh an toàn</span>
        </h1>
        <div class="eyes-hero" aria-hidden="true">
          <div class="eye e1"><span class="pupil"></span></div>
          <div class="eye e2"><span class="pupil"></span></div>
          <div class="secret-frames">
            <span></span><span></span><span></span>
          </div>
        </div>
        <p class="host-bubble wide" id="intro-text"></p>
        <button type="button" id="btn-start" class="btn btn-primary btn-xl">Mở những bức tranh bí mật!</button>
        <label class="voice-toggle">
          <input type="checkbox" id="toggle-voice" checked />
          <span>Nghe Đôi Mắt đọc</span>
        </label>
      </div>
    </section>

    <section id="screen-guide" class="screen screen-guide" aria-label="Hướng dẫn" hidden>
      <div class="guide-stage">
        <p class="brand">Cách chơi</p>
        <div class="guide-pics" aria-hidden="true">
          <div class="pic-frame demo">
            <div class="pic-scene say-no"></div>
            <span class="pic-key">A</span>
          </div>
          <div class="pic-frame demo">
            <div class="pic-scene silent"></div>
            <span class="pic-key">B</span>
          </div>
        </div>
        <p class="guide-text" id="guide-text"></p>
        <button type="button" id="btn-guide-next" class="btn btn-primary btn-xl">Bắt đầu tìm tranh!</button>
      </div>
    </section>

    <section id="screen-play" class="screen screen-play" aria-label="Chơi" hidden>
      <header class="play-bar">
        <a class="btn btn-icon back-mini" href="../" aria-label="Mục lục">←</a>
        <div class="progress-wrap">
          <div id="star-row" class="star-row" aria-label="Ngôi sao"></div>
          <p id="progress-text" class="progress-text">Sao: 0 / 10</p>
        </div>
        <button type="button" id="btn-speak" class="btn btn-icon" aria-label="Đọc lại">🔊</button>
      </header>

      <p class="prompt-line" id="prompt-line"></p>
      <div class="pics-row" id="pics-row"></div>
      <article class="statement-board">
        <p class="statement-kicker" id="question-kicker">Câu hỏi 1</p>
        <p id="statement-text" class="statement-text"></p>
      </article>
      <div class="choice-row" id="choice-row"></div>
    </section>

    <div id="feedback" class="feedback" hidden role="dialog" aria-modal="true">
      <div class="feedback-card">
        <div id="feedback-emoji" class="feedback-emoji">⭐</div>
        <h2 id="feedback-title" class="feedback-title">Đúng rồi!</h2>
        <p id="feedback-explain" class="feedback-explain"></p>
        <button type="button" id="btn-next" class="btn btn-primary btn-lg">Câu tiếp theo</button>
      </div>
    </div>

    <section id="screen-result" class="screen screen-result" aria-label="Kết thúc" hidden>
      <div class="result-stage">
        <p class="brand">Đôi Mắt Tinh Nghịch</p>
        <h2 class="result-title">Wow! Giỏi quá!</h2>
        <div id="result-collage" class="result-collage" aria-hidden="true"></div>
        <p id="result-message" class="result-message"></p>
        <p class="result-score">Ngôi sao: <strong id="result-correct">0</strong> / <span id="result-total">10</span></p>
        <div class="result-actions">
          <button type="button" id="btn-replay" class="btn btn-primary btn-xl">Cùng xem lại tranh</button>
          <a class="btn btn-secondary btn-lg" href="../">← Mục lục</a>
        </div>
      </div>
    </section>

    <script src="content.js"></script>
    <script src="audio-manifest.js?v=1"></script>
    <script src="game.js?v=1"></script>
  </body>
</html>
